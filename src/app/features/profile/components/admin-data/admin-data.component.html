<div class="card profile-card border-0 rounded-4 overflow-hidden">
          <div class="profile-banner"></div>

          <div class="card-body px-4 pb-4 pt-0">
            <div class="d-flex flex-column flex-sm-row align-items-sm-end justify-content-between gap-3 profile-header">
              <div class="d-flex align-items-end gap-3">
                <div class="profile-avatar d-flex align-items-center justify-content-center rounded-4 fw-bold">
                  {{ a.username[0] }}
                </div>
                <div class="pb-1">
                  <h3 class="profile-name fw-bold mb-0">{{ a.username }}</h3>
                  <span class="profile-username">{{ a.email }}</span>
                </div>
              </div>
            </div>

            <hr class="profile-divider my-4">

            <div class="row g-3">
              <div class="col-12 col-sm-6">
                <div class="info-tile p-3 rounded-3 h-100">
                  <div class="info-label d-flex align-items-center gap-2 mb-1">
                    <mat-icon class="info-icon">alternate_email</mat-icon>
                    <span>Username</span>
                  </div>
                  <div class="info-value">{{ a.username }}</div>
                </div>
              </div>

              <div class="col-12 col-sm-6">
                <div class="info-tile p-3 rounded-3 h-100">
                  <div class="info-label d-flex align-items-center gap-2 mb-1">
                    <mat-icon class="info-icon">mail</mat-icon>
                    <span>Email</span>
                  </div>
                  <div class="info-value text-break">{{ a.email }}</div>
                </div>
              </div>
            </div>
          </div>
        </div>
