<div class="card profile-card border-0 rounded-4 overflow-hidden">
          <div class="profile-banner"></div>

          <div class="card-body px-4 pb-4 pt-0">
            <div class="d-flex flex-column flex-sm-row align-items-sm-end justify-content-between gap-3 profile-header">
              <div class="d-flex align-items-end gap-3">
                <div class="profile-avatar d-flex align-items-center justify-content-center rounded-4">
                  {{ u.firstName[0] }}{{ u.lastName[0] }}
                </div>
                <div class="pb-1">
                  <h3 class="profile-name fw-bold mb-0">{{ u.firstName }} {{ u.lastName }}</h3>
                  <span class="profile-username">&#64;{{ u.username }}</span>
                </div>
              </div>
            </div>

            <hr class="profile-divider my-4">

            <div class="row g-3">
              <div class="col-12 col-sm-6">
                <div class="info-tile p-3 rounded-3 h-100">
                  <div class="info-label d-flex align-items-center gap-2 mb-1">
                    <mat-icon class="info-icon">person</mat-icon>
                    <span>First Name</span>
                  </div>
                  <div class="info-value">{{ u.firstName }}</div>
                </div>
              </div>

              <div class="col-12 col-sm-6">
                <div class="info-tile p-3 rounded-3 h-100">
                  <div class="info-label d-flex align-items-center gap-2 mb-1">
                    <mat-icon class="info-icon">badge</mat-icon>
                    <span>Last Name</span>
                  </div>
                  <div class="info-value">{{ u.lastName }}</div>
                </div>
              </div>

              <div class="col-12 col-sm-6">
                <div class="info-tile p-3 rounded-3 h-100">
                  <div class="info-label d-flex align-items-center gap-2 mb-1">
                    <mat-icon class="info-icon">alternate_email</mat-icon>
                    <span>Username</span>
                  </div>
                  <div class="info-value">{{ u.username }}</div>
                </div>
              </div>

              <div class="col-12 col-sm-6">
                <div class="info-tile p-3 rounded-3 h-100">
                  <div class="info-label d-flex align-items-center gap-2 mb-1">
                    <mat-icon class="info-icon">mail</mat-icon>
                    <span>Email</span>
                  </div>
                  <div class="info-value text-break">{{ u.email }}</div>
                </div>
              </div>

              <div class="col-12 col-sm-6">
                <div class="info-tile p-3 rounded-3 h-100">
                  <div class="info-label d-flex align-items-center gap-2 mb-1">
                    <mat-icon class="info-icon">cake</mat-icon>
                    <span>Date of Birth</span>
                  </div>
                  <div class="info-value">{{ u.dateOfBirth | date: 'dd.MM.yyyy' }}</div>
                </div>
              </div>
            </div>
          </div>
        </div>
